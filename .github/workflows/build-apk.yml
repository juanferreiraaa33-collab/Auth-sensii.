name: Gerar APK Auth Sensi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          mkdir extracted
          unzip AuthSensi-do-zero.zip -d extracted

      - name: Compilar APK
        run: gradle -p extracted/AuthSensi-do-zero assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Auth-Sensi-APK
          path: extracted/AuthSensi-do-zero/app/build/outputs/apk/debug/app-debug.apk
